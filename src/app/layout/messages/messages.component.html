<ng-template #messageTemplate let-message>
  <div class="message-container">
    <div class="message-img-container"><img class="message-icon" src="/../pictures/message.svg" alt=""></div>
    <div class="message-text">
      <h3 class="message-title">{{ message.type }}</h3>
      <p class="message-description">{{ message.text }}</p>
    </div>
    <button type="button" class="message-btn" aria-label="Закрыть сообщение"
      (click)="messageService.closeMessage(message.id)">
      <fa-icon class="message-img" [icon]="['fas', 'xmark']"></fa-icon>
    </button>
  </div>
</ng-template>

<div class="toasts">
  @if (messages$ | async; as messages) {
  @if (messages.length > 0) {
  @for(m of messages; track m.id) {
  <ng-container [ngTemplateOutlet]="messageTemplate" [ngTemplateOutletContext]="{ $implicit: m }"></ng-container>
  }
  }
  }

</div>
